name: Build Windows Executable

on:
    workflow_dispatch:
    push:
      branches:
        - main
jobs:
    build-windows:
      runs-on: windows-latest

      steps:
        - name: Download repository
          uses: actions/checkout@v6

        - name: Set up Python
          uses: actions/setup-python@v6
          with:
            python-version: "3.13"
            architecture: "x64"

        - name: Install dependencies
          run: python -m pip install Pillow PyInstaller

        - name: Build Windows executable
          run: >
            python -m PyInstaller
            --onefile
            --name GwensImageConverter
            main.py

        - name: Upload executable
          uses: actions/upload-artifact@v7
          with:
            name: GwensImageConverter-Windows
            path: dist/GwensImageConverter.exe
            if-no-files-found: error
